# Label taxonomy: material class, then grade aligned to resin codes and local buyer grades
# Version 0.2 (2026-09-25). The model predicts a class and a grade; a per-site file maps grades
# to the local buyer's grade names, bin numbers and colors (see docs/02-concept.md).
# Changes from 0.1 are marked "added"; decided by Amish on 2026-09-25 (WML-DDR-001 D3): keep them.
# Film and bags are LDPE (4) under plastic. Photo-only grading cannot reliably separate opaque
# HDPE from PP or identify black plastics; those items are expected to come out as "unsure".
classes:
  plastic:
    - PET (1)
    - HDPE (2)
    - PVC (3)
    - LDPE (4)
    - PP (5)
    - PS (6)
    - other or unknown (7)
  paper: [cardboard, mixed paper, newsprint]
  metal: [aluminum, steel]
  glass: [clear, colored]
  organic: [food, garden]
  hazardous: [battery, sharps, chemical, electronic]
  composite: [beverage carton, multilayer pouch]   # added: coated cartons and laminates sell differently from paper and film
# Outputs that are not classes (added):
outputs:
  unsure: shown when confidence is below the class threshold; goes to the Unsure bin
  hazard: any hazardous grade above a low threshold; never offered as a sortable grade
